<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Sparkle Suite QR Flyer Export</title>
    <style>
      :root {
        --bg-top: #fffdfd;
        --bg-bottom: #f2e8f6;
        --ink: #2a1f40;
        --muted: #5b526a;
        --muted-soft: #7a718d;
        --pill: #584a71;
        --line: rgba(72, 13, 223, 0.12);
        --card-line: rgba(196, 193, 206, 0.92);
        --white-card: rgba(255, 255, 255, 0.88);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        box-sizing: border-box;
        background:
          radial-gradient(circle at 16% 12%, rgba(210, 9, 227, 0.12), transparent 20%),
          radial-gradient(circle at 84% 16%, rgba(72, 13, 223, 0.09), transparent 22%),
          linear-gradient(180deg, #f7eff8 0%, #efe4f5 100%);
        color: var(--ink);
      }

      body {
        position: relative;
        padding: 0;
        background:
          radial-gradient(circle at 16% 12%, rgba(210, 9, 227, 0.12), transparent 20%),
          radial-gradient(circle at 84% 16%, rgba(72, 13, 223, 0.09), transparent 22%),
          linear-gradient(180deg, #f7eff8 0%, #efe4f5 100%);
      }

      .poster-frame {
        position: absolute;
        inset: 0;
        padding: 42px;
        display: grid;
        background:
          radial-gradient(circle at 16% 12%, rgba(210, 9, 227, 0.12), transparent 20%),
          radial-gradient(circle at 84% 16%, rgba(72, 13, 223, 0.09), transparent 22%),
          linear-gradient(180deg, #f7eff8 0%, #efe4f5 100%);
      }

      .flyer {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 42px;
        overflow: hidden;
        padding: 60px 58px 56px;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 34px;
        background:
          radial-gradient(circle at 16% 14%, rgba(210, 9, 227, 0.14), transparent 26%),
          radial-gradient(circle at 80% 18%, rgba(72, 13, 223, 0.08), transparent 24%),
          linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
        border: 1.5px solid var(--card-line);
        box-shadow: 0 40px 120px rgba(74, 40, 93, 0.16);
      }

      .flyer::before {
        content: "";
        position: absolute;
        inset: 26px;
        border-radius: 28px;
        border: 1px solid var(--line);
        pointer-events: none;
      }

      .eyebrow {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-weight: 800;
        color: var(--muted-soft);
      }

      .headline-wrap {
        max-width: 560px;
      }

      .headline {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        font-size: 76px;
        line-height: 0.95;
        letter-spacing: -0.05em;
        font-weight: 700;
      }

      .divider {
        width: 140px;
        height: 3px;
        border-radius: 999px;
        background: linear-gradient(90deg, #d209e3, #480ddf);
        margin-top: 20px;
      }

      .support {
        margin: 0;
        max-width: 520px;
        color: var(--muted);
        font-size: 28px;
        line-height: 1.55;
      }

      .bottom-area {
        align-self: end;
        display: grid;
        gap: 22px;
      }

      .proof-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .proof-row span {
        padding: 14px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(72, 13, 223, 0.08);
        color: var(--pill);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .qr-box {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 24px;
        align-items: center;
        padding: 24px;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(72, 13, 223, 0.08);
      }

      .qr-box img {
        display: block;
        width: 220px;
        height: 220px;
        border-radius: 22px;
        background: white;
        box-shadow: inset 0 0 0 14px white;
      }

      .qr-copy {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.32;
        color: var(--ink);
      }

      .qr-note {
        margin: 0;
        color: var(--muted-soft);
        font-size: 17px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="poster-frame">
      <section class="flyer" aria-label="Sparkle Suite QR flyer">
        <p class="eyebrow">Coming soon</p>

        <div class="headline-wrap">
          <h1 class="headline">A better customer experience starts with a better rep setup.</h1>
          <div class="divider"></div>
        </div>

        <p class="support">Sparkle Suite is being built for reps who want a smooth and polished customer experience.</p>

        <div class="bottom-area">
          <div class="proof-row" aria-label="Sparkle Suite proof points">
            <span>Dance Floor</span>
            <span>Live queue</span>
            <span>SMS updates</span>
          </div>

          <div class="qr-box">
            <img
              alt="QR code for the Sparkle Suite waitlist"
              src="https://api.qrserver.com/v1/create-qr-code/?size=1200x1200&margin=18&data=https%3A%2F%2Fwww.yoursparklesuite.com%2F"
            />
            <div>
              <p class="qr-copy">Scan to join the waitlist.</p>
              <p class="qr-note">Sparkle Suite prelaunch</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
