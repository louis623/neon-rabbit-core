<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sparkle Suite QR Flyer - Coming Soon</title>
    <link rel="stylesheet" href="promo.css" />
  </head>
  <body class="flyer-export-page">
    <main class="qr-flyer-v2" aria-label="Sparkle Suite QR flyer">
      <div class="qr-flyer-v2__texture" aria-hidden="true"></div>
      <div class="qr-flyer-v2__border" aria-hidden="true"></div>

      <header class="qr-flyer-v2__header">
        <p class="qr-flyer-v2__eyebrow">Coming soon</p>
        <h1>Sparkle Suite</h1>
        <p class="qr-flyer-v2__tagline">For reps who want smoother live shows</p>
      </header>

      <section class="qr-flyer-v2__scan">
        <h2>Scan to join the waitlist</h2>
        <div class="qr-flyer-v2__qr-wrap">
          <img
            class="qr-flyer-v2__qr"
            alt="QR code for the Sparkle Suite prelaunch page"
            src="https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&margin=18&data=https%3A%2F%2Fwww.yoursparklesuite.com%2F"
          />
        </div>
        <p>Screenshot or save this post, then scan the QR code.</p>
      </section>

      <section class="qr-flyer-v2__bottom">
        <p>A better customer experience starts with a better rep setup.</p>
        <ul>
          <li>Trade board</li>
          <li>Live queue</li>
          <li>Event calendar</li>
          <li>Nic-Nac</li>
        </ul>
        <strong>www.yoursparklesuite.com</strong>
      </section>
    </main>
  </body>
</html>
