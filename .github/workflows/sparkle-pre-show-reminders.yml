name: Sparkle Suite pre-show reminders

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call production reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.SPARKLE_PRE_SHOW_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "SPARKLE_PRE_SHOW_CRON_SECRET is not configured; skipping reminder trigger."
            exit 0
          fi
          curl --fail --show-error --silent --max-time 30 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://www.yoursparklesuite.com/api/internal/show-reminders/pre-show/live?limit=25"
